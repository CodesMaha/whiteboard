name: backup_deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  backup-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - run: |
              python -m pip install pygbag
              python tmpl_getter.py
              python -m pygbag --build \
                --package web.codesmaha.backup.whiteboard \
                --icon .github/workflows/favicon.png \
                --title "whiteboard (backup)" \
                --can_close 1 whiteboard
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "whiteboard/build/web"
      - id: deployment
        uses: actions/deploy-pages@v4
