name: backup_deploy

on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  backup-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - run: |
              python -m pip install pygbag
              python -m pygbag --build --package web.codesmaha.backup.whiteboard --can_close 1 whiteboard
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: whiteboard/build/web
