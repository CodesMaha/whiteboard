repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
  
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.0
    hooks:
      - id: typos
  
  - repo: https://github.com/thlorenz/doctoc
    rev: v2.5.0
    hooks:
      - id: doctoc
        language_version: 22.0.0
