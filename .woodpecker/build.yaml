when:
  - event: [push, manual]
    branch: main

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true

steps:
  build:
    image: python:3.13
    commands:
      - python -m pip install --root-user-action=ignore pygbag
      - python tmpl_getter.py
      # - apt-get update && apt-get install -y ffmpeg
      - >
        python -m pygbag --build 
        --package web.mahacodes.whiteboard 
        --ume_block 0 --can_close 1 
        whiteboard
  
  deploy:
    image: codeberg.org/gedankenstuecke/git-pages-woodpecker-plugin:v6
    settings:
      TOKEN:
        from_secret: cbtoken
      UPLOAD_DIR: whiteboard/build/web
      SITE_URL: https://mahacodes.codeberg.page/whiteboard/
